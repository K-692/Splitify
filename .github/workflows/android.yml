name: Build Splitify Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets for Capacitor
        env:
          VITE_BUILD_TARGET: capacitor
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'splitify-151bd.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'splitify-151bd' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'splitify-151bd.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '268134159684' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:268134159684:web:c93629b97bf18462907311' }}
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore (Optional)
        if: env.SPLITIFY_KEYSTORE_BASE64 != ''
        env:
          SPLITIFY_KEYSTORE_BASE64: ${{ secrets.SPLITIFY_KEYSTORE_BASE64 }}
        run: |
          echo "$SPLITIFY_KEYSTORE_BASE64" | base64 --decode > android/splitify-release-key.jks
          echo "SPLITIFY_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/splitify-release-key.jks" >> $GITHUB_ENV
          echo "SPLITIFY_KEYSTORE_PASSWORD=${{ secrets.SPLITIFY_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "SPLITIFY_KEY_ALIAS=${{ secrets.SPLITIFY_KEY_ALIAS || 'splitify' }}" >> $GITHUB_ENV
          echo "SPLITIFY_KEY_PASSWORD=${{ secrets.SPLITIFY_KEY_PASSWORD || secrets.SPLITIFY_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          VERSION=$(node -p "require('./package.json').version")
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "build-artifacts/Splitify-v${VERSION}.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "build-artifacts/Splitify-v${VERSION}-unsigned.apk"
          fi
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitify-android-apk
          path: build-artifacts/*.apk
          retention-days: 30
