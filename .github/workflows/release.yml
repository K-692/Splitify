name: Publish Android Release

# Publishes a GitHub Release for a version tag (e.g. v1.4.2) and attaches the
# signed APK committed at the repository root (Splitify-<tag>.apk).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.4.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Verify APK exists
        run: |
          APK="Splitify-${{ steps.tag.outputs.name }}.apk"
          test -f "$APK" || { echo "::error::$APK not found at repository root"; exit 1; }
          ls -lh "$APK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          APK="Splitify-${TAG}.apk"
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Splitify Android ${TAG}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "$APK" --title "Splitify Android ${TAG}" --notes-file "$NOTES" --latest
          fi
